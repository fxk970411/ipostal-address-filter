<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPostal1 地址筛选器 - CMRA/RDI/C1 预审与街景查询</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-animate {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 顶部导航 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2 rounded-xl shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">US Address Filter & Explorer</h1>
          <p class="text-xs text-slate-500">iPostal1 真实地址 · CMRA / RDI 智能风控校验</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs font-medium">
        <span id="stat-total" class="px-3 py-1 bg-slate-100 rounded-full text-slate-600">总数据: 加载中...</span>
        <span id="stat-c1" class="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full">C1 优选: 0</span>
        <button onclick="toggleBookmarkOnly()" id="btn-show-bookmarks" class="px-3 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full hover:bg-amber-100 transition-colors">
          ⭐ 收藏夹 (<span id="stat-bookmark-count">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">

    <!-- 筛选面板 -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-sm mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3.5">
        
        <!-- 搜索框 -->
        <div class="lg:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">关键词搜索</label>
          <div class="relative">
            <input type="text" id="filter-search" placeholder="输入街道、城市或邮编..." 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all pl-9" />
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <!-- 州筛选 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">所在州 (State)</label>
          <select id="filter-state" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            <option value="ALL">全部州 (All)</option>
          </select>
        </div>

        <!-- RDI 属性 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">地址属性 (RDI)</label>
          <select id="filter-rdi" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            <option value="ALL">全部 (All)</option>
            <option value="Residential">住宅 (Residential)</option>
            <option value="Commercial">商业 (Commercial)</option>
          </select>
        </div>

        <!-- CMRA 属性 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">转运标记 (CMRA)</label>
          <select id="filter-cmra" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            <option value="ALL">全部 (All)</option>
            <option value="No">非转运机构 (CMRA: No)</option>
            <option value="Yes">转运/代收机构 (CMRA: Yes)</option>
          </select>
        </div>

        <!-- C1 预审状态 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">C1 预审准入</label>
          <select id="filter-c1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
            <option value="ALL">全部 (All)</option>
            <option value="YES">通过 (Likely Accepted)</option>
            <option value="NO">拦截 (Rejected)</option>
          </select>
        </div>

      </div>

      <!-- 快捷标签、导出与重置 -->
      <div class="mt-4 pt-3.5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-slate-400">快速推荐:</span>
          <button onclick="setQuickFilter('C1_HIGH')" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg transition-colors font-medium border border-emerald-200">
            🎯 C1 黄金住宅地址
          </button>
          <button onclick="setQuickFilter('TAX_FREE')" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg transition-colors font-medium border border-indigo-200">
            🏝️ 免税州 C1 优选 (AK, FL, NV, TX, WA 等)
          </button>
          <button onclick="setQuickFilter('ALL_NON_CMRA')" class="px-2.5 py-1 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg transition-colors font-medium border border-blue-200">
            🛡️ 全部非 CMRA 地址
          </button>
        </div>
        <div class="flex items-center space-x-3">
          <button onclick="exportToCSV()" class="text-blue-600 hover:text-blue-800 transition-colors font-medium flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>导出 CSV</span>
          </button>
          <button id="btn-reset" class="text-slate-400 hover:text-slate-700 transition-colors underline">
            重置筛选
          </button>
        </div>
      </div>
    </div>

    <!-- 结果统计 -->
    <div class="flex items-center justify-between mb-4 px-1 text-sm text-slate-500">
      <div>
        筛选出 <span id="stat-filtered-count" class="font-bold text-slate-800">0</span> 条符合条件的地址
      </div>
      <div class="text-xs">
        每页显示 30 条
      </div>
    </div>

    <!-- 地址列表卡片容器 -->
    <div id="address-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- 空数据展示 -->
    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 mt-4">
      <div class="text-slate-300 mb-3">
        <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h3 class="text-base font-semibold text-slate-700">未找到符合条件的地址</h3>
      <p class="text-xs text-slate-400 mt-1">请尝试放宽筛选条件或搜索其他关键词</p>
    </div>

    <!-- 分页控件 -->
    <div id="pagination" class="mt-8 flex items-center justify-center space-x-2 pb-12"></div>

  </main>

  <script>
    let rawAddresses = [];
    let filteredAddresses = [];
    let bookmarks = JSON.parse(localStorage.getItem("ipostal_bookmarks") || "[]");
    let showBookmarksOnly = false;
    let currentPage = 1;
    const PAGE_SIZE = 30;

    const TAX_FREE_STATES = ["AK", "FL", "NV", "SD", "TN", "TX", "WA", "WY"];

    // DOM 元素
    const filterSearch = document.getElementById("filter-search");
    const filterState = document.getElementById("filter-state");
    const filterRdi = document.getElementById("filter-rdi");
    const filterCmra = document.getElementById("filter-cmra");
    const filterC1 = document.getElementById("filter-c1");
    const btnReset = document.getElementById("btn-reset");
    const container = document.getElementById("address-container");
    const emptyState = document.getElementById("empty-state");
    const pagination = document.getElementById("pagination");
    const statTotal = document.getElementById("stat-total");
    const statC1 = document.getElementById("stat-c1");
    const statBookmarkCount = document.getElementById("stat-bookmark-count");
    const statFilteredCount = document.getElementById("stat-filtered-count");

    // 加载数据
    async function loadData() {
      try {
        const res = await fetch("addresses.json");
        if (!res.ok) throw new Error("无法加载 addresses.json");
        rawAddresses = await res.json();

        initStatesDropdown();
        readUrlParams();
        updateBookmarkCount();
        applyFilters();
      } catch (err) {
        container.innerHTML = `<div class="col-span-full text-center text-red-500 py-10 font-medium">数据加载失败: ${err.message}</div>`;
      }
    }

    function initStatesDropdown() {
      const states = Array.from(new Set(rawAddresses.map(a => a.state).filter(Boolean))).sort();
      states.forEach(st => {
        const opt = document.createElement("option");
        opt.value = st;
        opt.textContent = st + (TAX_FREE_STATES.includes(st) ? " (免税)" : "");
        filterState.appendChild(opt);
      });
    }

    function readUrlParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("state")) filterState.value = params.get("state").toUpperCase();
      if (params.get("rdi")) filterRdi.value = params.get("rdi");
      if (params.get("cmra")) filterCmra.value = params.get("cmra");
      if (params.get("c1")) filterC1.value = params.get("c1").toUpperCase();
      if (params.get("q")) filterSearch.value = params.get("q");
    }

    function updateUrlParams() {
      const params = new URLSearchParams();
      if (filterState.value !== "ALL") params.set("state", filterState.value);
      if (filterRdi.value !== "ALL") params.set("rdi", filterRdi.value);
      if (filterCmra.value !== "ALL") params.set("cmra", filterCmra.value);
      if (filterC1.value !== "ALL") params.set("c1", filterC1.value);
      if (filterSearch.value.trim()) params.set("q", filterSearch.value.trim());

      const newUrl = `${window.location.pathname}${params.toString() ? "?" + params.toString() : ""}`;
      window.history.replaceState({}, "", newUrl);
    }

    function applyFilters() {
      const q = filterSearch.value.toLowerCase().trim();
      const state = filterState.value;
      const rdi = filterRdi.value;
      const cmra = filterCmra.value;
      const c1 = filterC1.value;

      filteredAddresses = rawAddresses.filter(item => {
        const fullAddr = `${item.validated_address || item.street}, ${item.city}, ${item.state} ${item.zip}`;

        if (showBookmarksOnly && !bookmarks.includes(fullAddr)) return false;
        if (state !== "ALL" && item.state !== state) return false;
        if (rdi !== "ALL" && item.rdi !== rdi) return false;
        if (cmra !== "ALL" && item.cmra !== cmra) return false;

        if (c1 === "YES" && !item.c1_acceptable) return false;
        if (c1 === "NO" && item.c1_acceptable) return false;

        if (q) {
          const matchStreet = (item.validated_address || item.street || "").toLowerCase().includes(q);
          const matchCity = (item.city || "").toLowerCase().includes(q);
          const matchZip = (item.zip || "").toLowerCase().includes(q);
          if (!matchStreet && !matchCity && !matchZip) return false;
        }

        return true;
      });

      currentPage = 1;
      updateUrlParams();
      updateStats();
      renderCards();
      renderPagination();
    }

    function updateStats() {
      statTotal.textContent = `总数据: ${rawAddresses.length}`;
      const c1Count = rawAddresses.filter(a => a.c1_acceptable).length;
      statC1.textContent = `C1 优选: ${c1Count}`;
      statFilteredCount.textContent = filteredAddresses.length;
    }

    function renderCards() {
      container.innerHTML = "";

      if (filteredAddresses.length === 0) {
        emptyState.classList.remove("hidden");
        pagination.classList.add("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      pagination.classList.remove("hidden");

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filteredAddresses.slice(start, start + PAGE_SIZE);

      pageItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between card-animate";

        const street = item.validated_address || item.street;
        const fullAddr = `${street}, ${item.city}, ${item.state} ${item.zip}`;
        const price = item.monthly_price ? `$${item.monthly_price}/月` : "$9.99/月";
        const isBookmarked = bookmarks.includes(fullAddr);

        let c1Badge = "";
        if (item.c1_acceptable) {
          c1Badge = `<span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-emerald-100 text-emerald-800 border border-emerald-200">✅ C1 极大概率通过</span>`;
        } else if (item.cmra === "Yes") {
          c1Badge = `<span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-rose-100 text-rose-800 border border-rose-200">❌ C1 拦截 (CMRA)</span>`;
        } else {
          c1Badge = `<span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-slate-100 text-slate-600">待验证</span>`;
        }

        let cmraBadge = item.cmra === "No" 
          ? `<span class="px-2 py-0.5 text-[11px] font-semibold rounded bg-emerald-50 text-emerald-700 border border-emerald-200">CMRA: No</span>`
          : `<span class="px-2 py-0.5 text-[11px] font-semibold rounded bg-rose-50 text-rose-700 border border-rose-200">CMRA: Yes</span>`;

        let rdiBadge = item.rdi === "Residential"
          ? `<span class="px-2 py-0.5 text-[11px] font-semibold rounded bg-blue-50 text-blue-700 border border-blue-200">RDI: 住宅</span>`
          : `<span class="px-2 py-0.5 text-[11px] font-semibold rounded bg-slate-100 text-slate-700">RDI: 商业</span>`;

        const mapsUrl = item.google_maps_url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddr)}`;
        const streetViewUrl = item.google_street_view_url || `https://www.google.com/maps/@?api=1&map_action=pano&query=${encodeURIComponent(fullAddr)}`;

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <span class="text-sm font-extrabold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg">${price}</span>
              ${c1Badge}
            </div>

            <h4 class="text-base font-bold text-slate-900 leading-snug line-clamp-2 mt-1">${street}</h4>
            <p class="text-xs text-slate-500 font-medium mt-0.5 mb-3">${item.city}, ${item.state} ${item.zip}</p>

            <div class="flex flex-wrap gap-1.5 mb-4">
              ${cmraBadge}
              ${rdiBadge}
              <span class="px-2 py-0.5 text-[11px] rounded bg-slate-50 text-slate-500 border border-slate-200">DPV: ${item.dpv_match_code || 'N/A'}</span>
            </div>
          </div>

          <div class="pt-3.5 border-t border-slate-100 flex items-center justify-between text-xs font-medium">
            <div class="flex items-center space-x-2">
              <button onclick="toggleBookmark('${fullAddr.replace(/'/g, "\\'")}')" 
                class="p-1 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors" title="收藏">
                <span class="${isBookmarked ? 'text-amber-500' : 'text-slate-300'} text-sm leading-none">★</span>
              </button>
              <button onclick="copyToClipboard('${fullAddr.replace(/'/g, "\\'")}', this)" 
                class="text-slate-600 hover:text-blue-600 flex items-center space-x-1 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <span>复制</span>
              </button>
            </div>

            <div class="flex items-center space-x-3">
              <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" 
                class="text-slate-500 hover:text-blue-600 flex items-center space-x-0.5 transition-colors">
                <span>地图</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </a>
              <a href="${streetViewUrl}" target="_blank" rel="noopener noreferrer" 
                class="text-emerald-600 hover:text-emerald-700 flex items-center space-x-0.5 font-semibold transition-colors">
                <span>实景</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              </a>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function renderPagination() {
      pagination.innerHTML = "";
      const totalPages = Math.ceil(filteredAddresses.length / PAGE_SIZE);
      if (totalPages <= 1) return;

      const prevBtn = document.createElement("button");
      prevBtn.textContent = "上一页";
      prevBtn.className = `px-3 py-1.5 rounded-lg border text-xs font-semibold ${currentPage === 1 ? 'border-slate-200 text-slate-300 cursor-not-allowed' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}`;
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; renderCards(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      pagination.appendChild(prevBtn);

      const indicator = document.createElement("span");
      indicator.className = "text-xs text-slate-500 px-3";
      indicator.textContent = `第 ${currentPage} / ${totalPages} 页`;
      pagination.appendChild(indicator);

      const nextBtn = document.createElement("button");
      nextBtn.textContent = "下一页";
      nextBtn.className = `px-3 py-1.5 rounded-lg border text-xs font-semibold ${currentPage === totalPages ? 'border-slate-200 text-slate-300 cursor-not-allowed' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}`;
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; renderCards(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      pagination.appendChild(nextBtn);
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span class="text-emerald-600 font-semibold">已复制!</span>`;
        setTimeout(() => { btn.innerHTML = originalText; }, 1500);
      });
    }

    function toggleBookmark(addr) {
      if (bookmarks.includes(addr)) {
        bookmarks = bookmarks.filter(b => b !== addr);
      } else {
        bookmarks.push(addr);
      }
      localStorage.setItem("ipostal_bookmarks", JSON.stringify(bookmarks));
      updateBookmarkCount();
      renderCards();
    }

    function updateBookmarkCount() {
      statBookmarkCount.textContent = bookmarks.length;
    }

    function toggleBookmarkOnly() {
      showBookmarksOnly = !showBookmarksOnly;
      const btn = document.getElementById("btn-show-bookmarks");
      if (showBookmarksOnly) {
        btn.classList.add("bg-amber-500", "text-white");
        btn.classList.remove("bg-amber-50", "text-amber-700");
      } else {
        btn.classList.remove("bg-amber-500", "text-white");
        btn.classList.add("bg-amber-50", "text-amber-700");
      }
      applyFilters();
    }

    function setQuickFilter(type) {
      showBookmarksOnly = false;
      document.getElementById("btn-show-bookmarks").classList.remove("bg-amber-500", "text-white");

      if (type === "C1_HIGH") {
        filterCmra.value = "No";
        filterRdi.value = "Residential";
        filterC1.value = "YES";
        filterState.value = "ALL";
      } else if (type === "TAX_FREE") {
        filterCmra.value = "No";
        filterC1.value = "YES";
        filterRdi.value = "ALL";
        // 自动定位首个有数据的免税州，或综合过滤
        filterSearch.value = "";
      } else if (type === "ALL_NON_CMRA") {
        filterCmra.value = "No";
        filterRdi.value = "ALL";
        filterC1.value = "ALL";
        filterState.value = "ALL";
      }
      applyFilters();
    }

    function exportToCSV() {
      if (filteredAddresses.length === 0) return alert("没有可导出的数据");
      const headers = ["Street", "City", "State", "Zip", "Price", "RDI", "CMRA", "C1_Pass", "Google_Maps", "Street_View"];
      const rows = filteredAddresses.map(a => [
        `"${(a.validated_address || a.street).replace(/"/g, '""')}"`,
        `"${a.city}"`,
        `"${a.state}"`,
        `"${a.zip}"`,
        `"${a.monthly_price || 9.99}"`,
        `"${a.rdi || ''}"`,
        `"${a.cmra || ''}"`,
        `"${a.c1_acceptable ? 'YES' : 'NO'}"`,
        `"${a.google_maps_url || ''}"`,
        `"${a.google_street_view_url || ''}"`
      ]);

      const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `addresses_export_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    btnReset.onclick = () => {
      filterSearch.value = "";
      filterState.value = "ALL";
      filterRdi.value = "ALL";
      filterCmra.value = "ALL";
      filterC1.value = "ALL";
      showBookmarksOnly = false;
      document.getElementById("btn-show-bookmarks").classList.remove("bg-amber-500", "text-white");
      applyFilters();
    };

    filterSearch.addEventListener("input", () => applyFilters());
    filterState.addEventListener("change", () => applyFilters());
    filterRdi.addEventListener("change", () => applyFilters());
    filterCmra.addEventListener("change", () => applyFilters());
    filterC1.addEventListener("change", () => applyFilters());

    loadData();
  </script>
</body>
</html>
